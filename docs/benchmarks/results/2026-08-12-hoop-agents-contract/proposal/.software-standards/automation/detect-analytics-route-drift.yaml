schema: ssb.dev/automation/v1
id: detect-analytics-route-drift
title: Detect analytics route drift
category: correctness
lenses:
  - kind: task
    value: verification
scopes:
  - "gateway/api/**/*.go"
  - "gateway/analytics/**/*.go"
derivation: extracted
evidence:
  - role: declares
    path: CLAUDE.md
    lines: 194-199
    excerpt_sha256: sha256:464543a2049637e81c764f90b0e61b2aabe5082857e58a004476419f0e7464a7
condition: Tracked gateway actions retain a constant-backed analytics emission when routes are added, replaced, or removed.
suggested_check: Compare changed route registrations and handlers with the baseline, flag tracked actions whose analytics middleware or Track call disappears, and reject event-name string literals.
trigger: Run when gateway API route registrations, handlers, or analytics event constants change.
expected_success: Every affected tracked action still emits its existing analytics constant or an explicitly mapped successor.
expected_failure: Report the route, removed or literal event, prior emission site, and missing or undocumented successor.
