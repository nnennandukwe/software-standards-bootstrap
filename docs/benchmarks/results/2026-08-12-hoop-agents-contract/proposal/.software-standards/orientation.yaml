guidance:
  - kind: planning
    text: Identify the affected module boundary and its public protocol or API contracts before proposing a change.
    evidence:
      - role: declares
        path: CLAUDE.md
        lines: 30-50
        excerpt_sha256: sha256:da3b4c71923fd707e3b9424929896dd8abab86f1ac1fd0504fd646474c035581
  - kind: implementation
    text: Preserve the documented library, gateway, agent, and shared-protocol boundaries while changing behavior.
    evidence:
      - role: declares
        path: CLAUDE.md
        lines: 52-68
        excerpt_sha256: sha256:ff2c556b1989060ed3a35392ddc1af1d220d0c368a8ee975b17cbccc72690657
  - kind: verification
    text: Use the documented focused verification for the affected surface before handoff.
    evidence:
      - role: declares
        path: DEV.md
        lines: 149-180
        excerpt_sha256: sha256:e8081231ab91b39870af3cc38d7485ad5529ca0f28f79f41835423c1f676cfac
  - kind: handoff
    text: Describe the change, tests performed, and any remaining concerns for reviewers.
    evidence:
