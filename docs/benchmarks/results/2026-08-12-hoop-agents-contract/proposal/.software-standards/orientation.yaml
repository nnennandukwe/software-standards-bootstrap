schema: ssb.dev/orientation/v1
summary:
  text: Hoop is an open-source layer 7 gateway that governs access to infrastructure at the wire-protocol boundary.
  evidence:
    - role: declares
      path: README.md
      lines: 33-43
      excerpt_sha256: sha256:4ce1f998526222d453a3d39843fb616c6c14804ca5e17ee4174f94259fe4f7ab
areas:
  - path: gateway
    purpose: Hosts the HTTP and gRPC gateway, business services, persistence, and transport plugins.
    evidence:
      - role: declares
        path: CLAUDE.md
        lines: 30-50
        excerpt_sha256: sha256:da3b4c71923fd707e3b9424929896dd8abab86f1ac1fd0504fd646474c035581
  - path: agent
    purpose: Hosts the long-lived agent connection and protocol-specific packet handlers.
    evidence:
