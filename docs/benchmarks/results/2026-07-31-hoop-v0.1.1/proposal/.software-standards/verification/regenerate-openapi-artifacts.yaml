schema: ssb.dev/verification/v1
id: regenerate-openapi-artifacts
title: Regenerate OpenAPI artifacts
category: documentation
lenses:
  - kind: task
    value: verification
scopes:
  - "gateway/api/**/*.go"
  - "gateway/api/openapi/**/*"
derivation: extracted
evidence:
  - ref: openapi-generation-target
    role: enforces
    path: Makefile
    lines: 148-150
    excerpt_sha256: sha256:1415c1c6dbb5d489b4eb9d5290ff28b11559fe83d56634020e8c506169063f3b
when: After changing an API route, handler annotation, or schema and before handoff.
steps:
  - run: make generate-openapi-docs
    source_evidence: openapi-generation-target
    expected_result: The generated OpenAPI v2 and v3 artifacts reflect the current gateway API definitions.
