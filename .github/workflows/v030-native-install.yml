name: Verify v0.3.0 public downloads on additional native runners
on:
  push:
    branches:
      - verification/v0.3.0-native-installs
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/v0.3.0
          fetch-depth: 0
          persist-credentials: false
      - name: Install the public archive and assess interrupted generation
        run: python3 scripts/verify-public-install.py v0.3.0
