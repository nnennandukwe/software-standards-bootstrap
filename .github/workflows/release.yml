name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify source
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go tool govulncheck ./...

      - name: Install Syft for per-archive SPDX SBOMs
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.49.0

      - name: Build archives, checksums, SBOMs, and draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest archive provenance from the SHA-256 manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest macOS amd64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/ssb_${{ github.ref_name }}_darwin_amd64.tar.gz
          sbom-path: dist/ssb_${{ github.ref_name }}_darwin_amd64.tar.gz.spdx.json

      - name: Attest macOS arm64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/ssb_${{ github.ref_name }}_darwin_arm64.tar.gz
          sbom-path: dist/ssb_${{ github.ref_name }}_darwin_arm64.tar.gz.spdx.json

      - name: Attest Linux amd64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/ssb_${{ github.ref_name }}_linux_amd64.tar.gz
          sbom-path: dist/ssb_${{ github.ref_name }}_linux_amd64.tar.gz.spdx.json

      - name: Attest Linux arm64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/ssb_${{ github.ref_name }}_linux_arm64.tar.gz
          sbom-path: dist/ssb_${{ github.ref_name }}_linux_arm64.tar.gz.spdx.json

      - name: Attest Windows amd64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/ssb_${{ github.ref_name }}_windows_amd64.zip
          sbom-path: dist/ssb_${{ github.ref_name }}_windows_amd64.zip.spdx.json

      - name: Attest Windows arm64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/ssb_${{ github.ref_name }}_windows_arm64.zip
          sbom-path: dist/ssb_${{ github.ref_name }}_windows_arm64.zip.spdx.json

      - name: Publish the completed draft
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
