name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/v*"

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Go 1.26.9
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.9
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/ssb

  quality:
    name: Race, vet, and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.9
          cache: true

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go tool govulncheck ./...

  release-archive-contract:
    name: Complete release archive contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.9
          cache: true

      - name: Check pinned release configuration and workflows
        run: |
          go run github.com/goreleaser/goreleaser/v2@v2.17.0 check
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Identify candidate archives before tagging
        if: startsWith(github.ref, 'refs/heads/release/v')
        run: |
          version=${GITHUB_REF_NAME#release/}
          sh scripts/release-notes.sh "$version" > /dev/null
          echo "GORELEASER_CURRENT_TAG=$version-rc" >> "$GITHUB_ENV"

      - name: Build and verify every release archive
        run: make verify-release-archives

      - name: Retain candidate archives for installer verification
        if: startsWith(github.ref, 'refs/heads/release/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssb-candidate-${{ github.sha }}
          path: |
            dist/ssb_*.tar.gz
            dist/ssb_*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
