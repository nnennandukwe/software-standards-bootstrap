name: Inventory resource evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/inventory-resource-evidence.yml"
      - "internal/evaluation/**"
      - "internal/inventory/**"
      - "scripts/benchmark-inventory-resources.sh"

permissions:
  contents: read

jobs:
  linux-amd64:
    name: Linux amd64 resource envelope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Clone pinned benchmark repositories
        env:
          BENCHMARK_ROOT: ${{ runner.temp }}/ssb-benchmark-targets
        run: |
          set -eu
          mkdir -p "$BENCHMARK_ROOT"

          fetch_pin() {
            name="$1"
            repository="$2"
            commit="$3"
            target="$BENCHMARK_ROOT/$name"

            git init "$target"
            git -C "$target" remote add origin "$repository"
            git -C "$target" fetch --depth=1 --no-tags origin "$commit"
            git -C "$target" checkout --detach FETCH_HEAD
          }

          fetch_pin cobra https://github.com/spf13/cobra.git adbc8813901bba65827259daa8e22ff94ec1f30e
          fetch_pin flask https://github.com/pallets/flask.git 36e4a824f340fdee7ed50937ba8e7f6bc7d17f81
          fetch_pin django https://github.com/django/django.git 50c2b7c83661a61da48f78dd0130fc3cbf8ed39f
          fetch_pin next.js https://github.com/vercel/next.js.git 6c6d1632e1e1f03e32db1dd8dc0a63dee49d68cd

      - name: Record native Linux amd64 resource evidence
        env:
          SSB_BENCHMARK_ROOT: ${{ runner.temp }}/ssb-benchmark-targets
        run: |
          set -eu
          uname -a
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          getconf LONG_BIT
          git --version
          go version
          scripts/benchmark-inventory-resources.sh
